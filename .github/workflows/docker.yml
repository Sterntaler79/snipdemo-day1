name: Build and push image

on:
  push:
    branches:
      - main
    paths:
      - bundle
      - .github/workflows/docker.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out release and submodules
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Test CLI
        run: npm test
        working-directory: cli

      - name: Test frontend
        run: |
          npm ci
          npm test -- --watch=false --browsers=ChromeHeadless
        working-directory: frontend

      - name: Scan dependencies
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build image without publishing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./bundle
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Scan built image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: table
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Smoke-test built image
        env:
          IMAGE_REF: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
        shell: bash
        run: |
          set -euo pipefail
          container=$(docker run --rm -d -p 127.0.0.1:3000:3000 "$IMAGE_REF")
          trap 'docker stop "$container" >/dev/null' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/api/links >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3000/ | grep -qi '<html'
          status=$(curl --silent --output "$RUNNER_TEMP/snip-link.json" --write-out '%{http_code}' \
            -X POST http://127.0.0.1:3000/api/links \
            -H 'content-type: application/json' \
            -d '{"url":"https://example.com"}')
          test "$status" = "201"
          code=$(node -e 'process.stdout.write(require(process.argv[1]).code)' "$RUNNER_TEMP/snip-link.json")
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            "http://127.0.0.1:3000/$code")
          test "$status" = "302"
          curl --fail --silent http://127.0.0.1:3000/api/links |
            node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{if(JSON.parse(s)[0]?.hits!==1)process.exit(1)})'
          SNIP_API=http://127.0.0.1:3000 node cli/cli.js ls | grep -F 'https://example.com'

      - name: Push scanned image tags
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          printf '%s\n' "$IMAGE_TAGS" | while IFS= read -r tag; do
            [ -z "$tag" ] || docker push "$tag"
          done
